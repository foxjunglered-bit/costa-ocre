<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petit village peint</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1812;--fg:#f6ead4;--btn:#ffc23d;--btnd:#a9720c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Baloo 2',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 16px;box-sizing:border-box}
#frame{position:relative;width:min(100%,calc((100vh - 90px)*0.8));aspect-ratio:4/5;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
canvas{display:block;width:100%;height:100%}
#bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:14px;background:var(--btn);box-shadow:0 4px 0 var(--btnd);font-family:inherit;font-weight:800;font-size:16px;color:#1c140b;padding:8px 16px;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--btnd)}
button:disabled{opacity:.5}
#st{font-size:13px;opacity:.7;min-width:110px;text-align:center;align-self:center}
</style>
</head>
<body>
<div id="frame"><canvas id="cv"></canvas></div>
<div id="bar">
  <button id="again">🎲 Nouveau village</button>
  <button id="save">⬇️ Enregistrer</button>
  <span id="st"></span>
</div>
<script>
/* Petit village peint : une scène dessinée en formes simples (esquisse),
   puis repeinte touche par touche façon couteau à peindre. */
const W=1000,H=1250,K=1.5;            // esquisse 1000×1250, tableau ×1.5
const VP={x:640,y:470};               // point de fuite (ligne d'horizon de la mer)
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=Math.random;
const rr=(a,b)=>a+R()*(b-a),pick=a=>a[Math.floor(R()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- outils de dessin ---------- */
function poly(g,pts,fill){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=fill;g.fill();}
function blob(g,x,y,r,fill){g.beginPath();const n=9,o=R()*6;for(let k=0;k<=n;k++){const a=k/n*6.283+o,rad=r*(0.75+0.25*Math.sin(k*2.1+o)+R()*0.15);const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad*0.85;k?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();g.fillStyle=fill;g.fill();}
function onLine(p,x){return p[1]+(VP.y-p[1])*(x-p[0])/(VP.x-p[0]);}   // y sur la fuite partant de p
function quadPt(q,u,v){const a=[lerp(q[0][0],q[1][0],u),lerp(q[0][1],q[1][1],u)],b=[lerp(q[3][0],q[2][0],u),lerp(q[3][1],q[2][1],u)];return[lerp(a[0],b[0],v),lerp(a[1],b[1],v)];}
function sub(q,u0,v0,u1,v1){return[quadPt(q,u0,v0),quadPt(q,u1,v0),quadPt(q,u1,v1),quadPt(q,u0,v1)];}
function clip(g,pts,fn){g.save();g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.clip();fn();g.restore();}

/* ---------- éléments ---------- */
function sky(g){const gr=g.createLinearGradient(0,0,0,480);gr.addColorStop(0,'#2f7fd0');gr.addColorStop(0.55,'#4f9fe0');gr.addColorStop(1,'#8cc6ee');g.fillStyle=gr;g.fillRect(0,0,W,500);
  for(let k=0;k<70;k++){g.fillStyle=pick(['rgba(30,110,200,.35)','rgba(120,190,240,.35)','rgba(70,150,225,.4)']);g.fillRect(rr(0,W),rr(0,460),rr(30,90),rr(6,14));}}
function cloud(g,x,y,s){const parts=[];for(let k=0;k<9;k++)parts.push([x+rr(-1,1)*s*1.3,y+rr(-0.5,0.3)*s,s*rr(0.35,0.6)]);
  parts.forEach(p=>blob(g,p[0]+s*0.08,p[1]+s*0.12,p[2],'#a9bcd6'));
  parts.forEach(p=>blob(g,p[0],p[1],p[2]*0.92,'#eef3f8'));
  parts.forEach(p=>blob(g,p[0]-p[2]*0.2,p[1]-p[2]*0.25,p[2]*0.55,'#ffffff'));}
function mountain(g){const m=[[380,440],[430,360],[470,300],[505,250],[530,200],[555,165],[580,135],[600,128],[625,150],[650,150],[680,172],[700,165],[730,180],[770,200],[800,215],[830,262],[870,320],[910,350],[940,370],[975,380],[1000,392],[1000,470],[380,470]];
  for(let k=1;k<m.length-3;k++)m[k][1]+=rr(-8,8);
  poly(g,m,'#4f71a8');
  clip(g,m,()=>{for(let k=0;k<40;k++)blob(g,rr(450,800),rr(150,380),rr(20,50),pick(['#7c97c4','#93aad0','#6a86b8']));
    for(let k=0;k<130;k++){const x=rr(470,980),y=rr(150,420),l=rr(30,90),a=rr(0.5,1.1);g.save();g.translate(x,y);g.rotate(a);
      g.fillStyle=pick(['#dfe6ef','#c4d0e2','#e9eef4','#9fb1cf']);g.fillRect(0,0,l,rr(4,11));g.restore();}
    for(let k=0;k<40;k++){g.save();g.translate(rr(480,990),rr(170,430));g.rotate(rr(0.6,1.2));g.fillStyle=pick(['#33507f','#3d5f96']);g.fillRect(0,0,rr(30,70),rr(3,7));g.restore();}
    const gr=g.createLinearGradient(0,330,0,470);gr.addColorStop(0,'rgba(80,160,60,0)');gr.addColorStop(0.45,'#5aa33f');gr.addColorStop(1,'#3f8a34');g.fillStyle=gr;g.fillRect(400,300,600,180);});
  poly(g,[[940,400],[985,385],[1000,388],[1000,450],[930,450]],'#7b98c4');}
function sea(g){const s=[[640,452],[1000,452],[1000,640],[905,632],[830,600],[740,560],[660,505]];poly(g,s,'#2a5fb0');
  clip(g,s,()=>{for(let k=0;k<160;k++){g.fillStyle=pick(['#3b78c9','#1f4f9c','#4a8ad6','#2d66b8']);g.fillRect(rr(690,1000),rr(452,640),rr(20,70),rr(2,5));}
    g.fillStyle='rgba(200,225,250,.5)';for(let k=0;k<20;k++)g.fillRect(rr(760,1000),rr(455,470),rr(10,40),2);});
  // presqu'île et côte lointaine
  poly(g,[[760,535],[820,522],[900,526],[935,536],[880,548],[800,552]],'#7fae55');
  poly(g,[[760,452],[1000,452],[1000,458],[780,460]],'#3f7e3c');}
function hillside(g){poly(g,[[380,420],[520,400],[620,440],[650,470],[660,505],[740,560],[830,600],[905,632],[1000,640],[1000,900],[380,900]],'#5f9e3e');
  for(let k=0;k<160;k++){const x=rr(390,880),y=rr(410,700);blob(g,x,y,rr(6,16),pick(['#4f8c35','#76b24a','#3e7a2e','#8cc35a']));}}
function box(g,x,y,w,h,d,roof,opt={}){ // petite maison vue de 3/4 : façade claire, côté ombré, toit à deux pans
  const rh=h*0.55,side=opt.left?-1:1,sx=x+(side>0?w:0);
  poly(g,[[sx,y],[sx+d*side,y-d*0.35],[sx+d*side,y-h-d*0.35],[sx,y-h]],opt.shade||'#a9b6d3');
  poly(g,[[x,y],[x+w,y],[x+w,y-h],[x,y-h]],opt.wall||'#f1ebde');
  poly(g,[[x-w*0.08,y-h+2],[x+w/2,y-h-rh],[x+w*1.08,y-h+2]],opt.wall||'#efe6d5');
  // pan du toit visible sur le côté
  const ax=x+w/2,ay=y-h-rh;poly(g,[[ax,ay],[ax+d*side,ay-d*0.35],[sx+(d+w*0.08)*side,y-h-d*0.35+3],[sx+w*0.08*side,y-h+3]],roof);
  g.strokeStyle='#8e3a17';g.lineWidth=Math.max(1,w*0.05);g.beginPath();g.moveTo(x-w*0.08,y-h+2);g.lineTo(ax,ay);g.lineTo(x+w*1.08,y-h+2);g.stroke();
  if(w>14){g.fillStyle=opt.win||'#6b3a22';const ww=w*0.16;g.fillRect(x+w*0.22,y-h*0.7,ww,h*0.22);g.fillRect(x+w*0.62,y-h*0.7,ww,h*0.22);if(h>40)g.fillRect(x+w*0.42,y-h*0.32,ww*1.2,h*0.32);}}
function distantVillage(g){const hs=[];
  for(let k=0;k<150;k++){const x=rr(430,900),yb=430+(x-430)*0.3+rr(-25,70);
    if(x>640&&yb<512+(x-660)*0.62)continue; // pas dans la mer
    if(yb>690)continue;const s=0.7+((yb-420)/270)*1.3;hs.push([x,yb,s]);}
  // presqu'île
  for(let k=0;k<12;k++)hs.push([rr(775,905),rr(530,548),0.55]);
  hs.sort((a,b)=>a[1]-b[1]).forEach(([x,y,s])=>{box(g,x,y,rr(9,15)*s,rr(7,12)*s,rr(4,7)*s,pick(['#d9622e','#e0733a','#c9532a','#e88a4a']));
    if(R()<0.4)blob(g,x+rr(-8,18)*s,y+3,rr(4,8)*s,pick(['#3f7e2e','#5c9a3c']));});}
function belltower(g,x,y){poly(g,[[x,y],[x+16,y],[x+16,y-78],[x,y-78]],'#efe7d6');poly(g,[[x+16,y],[x+22,y-3],[x+22,y-80],[x+16,y-78]],'#a8b4cf');
  g.fillStyle='#4a3428';g.fillRect(x+5,y-66,6,10);poly(g,[[x-2,y-78],[x+10,y-112],[x+24,y-80]],'#c75a2c');poly(g,[[x-3,y-76],[x+25,y-79],[x+25,y-82],[x-3,y-80]],'#d7cdb8');}
function tree(g,x,y,r,dark=0){const n=Math.round(r/6)+8;
  for(let k=0;k<n;k++)blob(g,x+rr(-1,1)*r*0.8,y+rr(-0.6,0.9)*r*0.8,r*rr(0.3,0.5),pick(dark?['#24572a','#2e6630','#1d4a26']:['#2f6a2e','#3a7a33','#2a5e2c']));
  for(let k=0;k<n;k++)blob(g,x+rr(-0.9,0.5)*r*0.7,y+rr(-0.9,0.3)*r*0.7,r*rr(0.22,0.38),pick(['#4f9a3a','#5fab42','#46893a']));
  for(let k=0;k<n*0.7;k++)blob(g,x+rr(-0.9,0.2)*r*0.7,y+rr(-1,-0.1)*r*0.7,r*rr(0.12,0.22),pick(['#8fcf5a','#a6dc68','#78bd4c','#c4e67a']));}
function recHouse(g,o){ // grande maison : façade avant + mur latéral fuyant vers VP
  const xn=o.xn,xf=o.xf,yTn=o.yT,yBn=o.yB,fw=o.fw;
  const T=[xn,yTn],B=[xn,yBn],tf=[xf,onLine(T,xf)],bf=[xf,onLine(B,xf)];
  const wall=[T,tf,bf,B];
  // façade avant (ombrée) avec pignon
  const R1=[xn-fw*0.45,yTn-o.rh];
  poly(g,[[xn-fw,yBn+6],[xn,yBn],[xn,yTn],[R1[0],R1[1]],[xn-fw,yTn+10]],'#c9c3c0');
  clip(g,[[xn-fw,yBn+6],[xn,yBn],[xn,yTn],[R1[0],R1[1]],[xn-fw,yTn+10]],()=>{for(let k=0;k<30;k++)blob(g,rr(xn-fw,xn),rr(yTn-o.rh,yBn),rr(10,30),pick(['#a3a9c4','#c9cbd8','#9aa0bd','#d2c3a8']));});
  // mur fuyant éclairé
  poly(g,wall,'#f0e7d3');
  clip(g,wall,()=>{for(let k=0;k<26;k++){const p=quadPt(wall,R(),R());blob(g,p[0],p[1],rr(10,34)*o.s,pick(['rgba(214,160,90,.55)','rgba(235,214,170,.8)','rgba(200,170,130,.5)','rgba(250,246,236,.9)']));}
    for(let k=0;k<14;k++){const p=quadPt(wall,R(),rr(0.55,1));g.strokeStyle='rgba(120,100,80,.6)';g.lineWidth=2;g.fillStyle=pick(['#c9bba0','#d8cdb4','#b8aa92']);g.beginPath();g.ellipse(p[0],p[1],rr(10,22)*o.s,rr(6,12)*o.s,rr(-0.3,0.3),0,6.283);g.fill();g.stroke();}
    const gr=g.createLinearGradient(0,yTn,0,yBn);gr.addColorStop(0,'rgba(255,240,210,0)');gr.addColorStop(0.75,'rgba(150,140,170,0)');gr.addColorStop(1,'rgba(120,120,170,.45)');g.fillStyle=gr;g.fillRect(xn,yTn-100,xf-xn,yBn-yTn+120);});
  // fenêtres à volets fermés
  o.wins.forEach(w=>{const f=sub(wall,w[0]-0.03,w[1]-0.025,w[2]+0.03,w[3]+0.02);poly(g,f,'#f8f2e4');
    const q=sub(wall,...w);poly(g,q,'#7a3a1c');const mid=(w[0]+w[2])/2;
    g.strokeStyle='#4b220f';g.lineWidth=2*o.s;for(let k=1;k<9;k++){const a=quadPt(q,0,k/9),b=quadPt(q,1,k/9);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
    const a=quadPt(q,0.5,0),b=quadPt(q,0.5,1);g.lineWidth=3*o.s;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
    poly(g,sub(q,0,0,0.08,1),'#9a5530');poly(g,sub(q,0,0.96,1,1.08),'#d8ccb4');});
  if(o.door){const q=sub(wall,...o.door);poly(g,q,'#3a2b2a');poly(g,sub(q,0.12,0.05,0.88,1),'#5b3a26');}
  // toit en tuiles
  const E1=[xn-6,yTn-4],E2=[xf+o.ov,onLine([xn-6,yTn-4],xf+o.ov)];
  const Rn=[R1[0],R1[1]],Rf=[xf+o.ov-o.rd,onLine(Rn,xf+o.ov-o.rd)];
  const roof=[Rn,Rf,E2,E1];poly(g,roof,'#c75f2b');
  clip(g,roof,()=>{for(let k=0;k<=14;k++){const v=k/14,a=quadPt(roof,0,v),b=quadPt(roof,1,v);g.strokeStyle=pick(['#e58a4a','#a8461f','#d97036','#f0a060']);g.lineWidth=rr(3,7)*o.s;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
    for(let k=0;k<60;k++){const p=quadPt(roof,R(),R());g.fillStyle=pick(['#8f3a18','#f2a868','#b9502a']);g.fillRect(p[0],p[1],rr(4,10)*o.s,rr(3,6)*o.s);}});
  poly(g,[E1,E2,[E2[0],E2[1]+9*o.s],[E1[0],E1[1]+11*o.s]],'#4f2412');
  g.strokeStyle='#a5441c';g.lineWidth=9*o.s;g.beginPath();g.moveTo(xn-fw-10,yTn+16);g.lineTo(Rn[0],Rn[1]);g.lineTo(E1[0],E1[1]);g.stroke();
  // gouttière / tuyau
  g.strokeStyle='#8a8f9e';g.lineWidth=4*o.s;g.beginPath();const pp=quadPt(wall,0.04,0.05),pq=quadPt(wall,0.04,1);g.moveTo(pp[0],pp[1]);g.lineTo(pq[0],pq[1]);g.stroke();
  return wall;}
function pathAndWall(g){
  const L=[[130,1250],[580,1100],[330,880],[575,712]],Rt=[[602,712],[560,850],[900,1000],[1000,1190]];
  g.beginPath();g.moveTo(L[0][0],L[0][1]);g.bezierCurveTo(L[1][0],L[1][1],L[2][0],L[2][1],L[3][0],L[3][1]);g.lineTo(Rt[0][0],Rt[0][1]);g.bezierCurveTo(Rt[1][0],Rt[1][1],Rt[2][0],Rt[2][1],Rt[3][0],Rt[3][1]);g.lineTo(1000,H);g.closePath();
  g.fillStyle='#e6d5a6';g.fill();g.save();g.clip();
  for(let k=0;k<900;k++){const y=rr(700,1250),s=0.3+(y-700)/550*1.6;g.fillStyle=pick(['#f4ecd4','#efe1b8','#d9c48f','#fbf5e4','#cdb78a']);g.beginPath();g.ellipse(rr(0,1000),y,rr(5,12)*s,rr(3,7)*s,rr(-0.4,0.4),0,6.283);g.fill();}
  for(let k=0;k<260;k++){const y=rr(700,1250),s=0.3+(y-700)/550*1.6;g.fillStyle=pick(['rgba(170,160,205,.6)','rgba(150,140,190,.5)','rgba(200,170,120,.5)']);g.fillRect(rr(0,1000),y,rr(6,14)*s,rr(2,4)*s);}
  // bande d'herbe au milieu et ombres bleues au premier plan
  const bz=(P,t)=>{const m=1-t;return[m*m*m*P[0][0]+3*m*m*t*P[1][0]+3*m*t*t*P[2][0]+t*t*t*P[3][0],m*m*m*P[0][1]+3*m*m*t*P[1][1]+3*m*t*t*P[2][1]+t*t*t*P[3][1]];};
  for(let k=0;k<220;k++){const t=R(),a=bz(L,1-t),b=bz(Rt,t*0.92),cx=(a[0]+b[0])/2,y=(a[1]+b[1])/2,s=0.3+(y-712)/538*1.6;blob(g,cx+rr(-25,25)*s,y+rr(-6,6)*s,rr(4,9)*s,pick(['#6aa840','#8cc355','#4f8a34','#a8c870']));}
  for(let k=0;k<26;k++)blob(g,rr(150,900),rr(1130,1260),rr(30,70),pick(['rgba(110,110,180,.55)','rgba(140,130,200,.5)','rgba(90,100,170,.5)']));
  g.restore();
  // muret en pierres sèches le long du chemin
  const pts=[];for(let k=0;k<=60;k++){const q=bz(Rt,k/60);pts.push([q[0]+10+k/60*20,q[1]-8]);}
  for(let row=0;row<3;row++)pts.forEach((p,k)=>{const t=k/60,s=0.35+t*2.1;if(row===2&&R()<0.3)return;
    const x=p[0]+rr(-3,3)*s+row*4*s,y=p[1]-row*14*s+rr(-2,2);
    g.fillStyle=pick(['#6b6f8f','#5d6283']);g.beginPath();g.ellipse(x+3*s,y+4*s,13*s,9*s,0,0,6.283);g.fill();
    g.fillStyle=pick(['#e9e6df','#d6d4d6','#c9c4b8','#f4f1ea','#b9b4ae','#d8c9a8']);g.beginPath();g.ellipse(x,y,rr(10,15)*s,rr(7,10)*s,rr(-0.3,0.3),0,6.283);g.fill();
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(x-3*s,y-3*s,5*s,3*s,0,0,6.283);g.fill();
    g.fillStyle='rgba(110,115,170,.45)';g.beginPath();g.ellipse(x+5*s,y+4*s,6*s,3*s,0,0,6.283);g.fill();});}
function grass(g,x0,y0,x1,y1,n,big){for(let k=0;k<n;k++){const x=rr(x0,x1),y=rr(y0,y1),s=big?rr(1,2.2):1;
  g.strokeStyle=pick(['#5c9a36','#7fb84a','#3f7a2c','#a9c564','#c9b45a','#8aa040']);if(R()<0.6){blob(g,x,y,rr(6,14)*s,g.strokeStyle);continue;}g.lineWidth=rr(3,6)*s;g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(-8,8)*s,y-rr(8,20)*s);g.stroke();}
  for(let k=0;k<n/12;k++){g.fillStyle=pick(['#f2d34a','#ffffff','#e86a4a','#f0b43c']);g.beginPath();g.arc(rr(x0,x1),rr(y0,y1),rr(2,4),0,6.283);g.fill();}}

/* ---------- esquisse complète ---------- */
function sketch(seed){R=rng(seed);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  sky(g);const cn=[[460,90,90],[640,40,70],[900,140,100],[300,40,60],[990,280,80],[160,120,70]];cn.forEach(p=>{if(R()<0.85)cloud(g,p[0]+rr(-60,60),p[1]+rr(-20,30),p[2]*rr(0.8,1.2));});
  mountain(g);poly(g,[[0,430],[1000,430],[1000,H],[0,H]],'#5d9a3c');sea(g);hillside(g);distantVillage(g);
  for(let k=0;k<18;k++)tree(g,rr(420,760),rr(560,700),rr(14,26));
  belltower(g,rr(770,810),rr(600,615));
  // maisons à mi-distance
  for(let k=0;k<40;k++)blob(g,rr(380,1000),rr(560,760),rr(12,30),pick(['#3e7a30','#4f8f38','#2f6a2e','#7cb84c']));
  tree(g,610,690,28,1);
  const mids=[[560,612,40,36,16],[640,652,52,44,20],[720,700,60,50,22]];
  mids.forEach(m=>{box(g,m[0]+rr(-12,12),m[1],m[2],m[3],m[4],pick(['#d2602c','#e0763c','#c8562a']),{shade:'#a3b0d4',wall:'#efe9df'});blob(g,m[0]+m[2]*0.9,m[1]+4,m[2]*0.35,'#3f7a2e');});
  // grands arbres à droite
  [[975,610,95],[930,700,100],[1000,780,110],[850,740,70],[1000,900,110],[770,800,50],[880,840,70]].forEach(t=>tree(g,t[0],t[1],t[2]*rr(0.9,1.1),t[2]>100?0:1));
  grass(g,640,760,1000,1000,500);
  pathAndWall(g);
  grass(g,900,1000,1000,1250,250,1);
  // maisons de gauche
  recHouse(g,{xn:395,xf:540,yT:490,yB:740,fw:90,rh:40,rd:30,ov:14,s:0.6,wins:[[0.3,0.12,0.48,0.38],[0.62,0.5,0.8,0.78]],door:[0.22,0.55,0.42,1]});
  tree(g,520,610,24);
  recHouse(g,{xn:165,xf:378,yT:300,yB:985,fw:220,rh:120,rd:110,ov:26,s:1,wins:[[0.45,0.06,0.66,0.3],[0.38,0.5,0.6,0.8]]});
  // lierre et végétation sur la maison
  for(let k=0;k<26;k++){const y=rr(230,900),x=rr(-30,60+ (y-230)*0.12);tree(g,x,y,rr(28,55),R()<0.45);}
  for(let k=0;k<12;k++)tree(g,rr(90,165),rr(320,760),rr(12,24),R()<0.3);
  for(let k=0;k<6;k++)tree(g,rr(160,200),rr(330,600),rr(10,20));
  for(let k=0;k<70;k++){const y=rr(700,1000),x=rr(250,lerp(560,380,(y-700)/300));blob(g,x,y,rr(10,26)*(0.6+(y-700)/300),pick(['#3e7a30','#5b9a3a','#8cbf55','#c2b860','#2f6a2e']));}
  for(let k=0;k<8;k++)tree(g,rr(400,540),rr(730,800),rr(16,28),1);
  grass(g,0,950,330,1250,700,1);grass(g,200,820,480,980,350);
  for(let k=0;k<10;k++)blob(g,rr(0,260),rr(960,1080),rr(18,34),pick(['#c9c6c2','#e6e2da','#a7a3b8']));
  return c;}

/* ---------- peinture au couteau ---------- */
const cv=document.getElementById('cv');cv.width=W*K;cv.height=H*K;const ctx=cv.getContext('2d');
let job=0;
function paint(seed){const my=++job;const base=sketch(seed);const bd=base.getContext('2d').getImageData(0,0,W,H).data;
  const lum=new Float32Array(W*H);for(let i=0;i<W*H;i++)lum[i]=bd[i*4]*0.3+bd[i*4+1]*0.59+bd[i*4+2]*0.11;
  const L=(x,y)=>lum[Math.min(H-1,Math.max(0,y))*W+Math.min(W-1,Math.max(0,x))];
  function grad(x,y){let gx=0,gy=0;for(let d=1;d<=3;d+=2){gx+=L(x+d,y)-L(x-d,y);gy+=L(x,y+d)-L(x,y-d);}return[gx,gy];}
  ctx.filter='blur(3px)';ctx.drawImage(base,0,0,W*K,H*K);ctx.filter='none';
  const passes=[{n:7000,l:[30,52],w:[18,28],d:0},{n:20000,l:[16,28],w:[9,14],d:0.3},{n:34000,l:[8,16],w:[4,7],d:1},{n:12000,l:[5,9],w:[2.5,4],d:2}];
  const plan=[];passes.forEach(p=>{for(let k=0;k<p.n;k++)plan.push(p);});
  let i=0;const st=document.getElementById('st'),btn=document.getElementById('again');btn.disabled=true;
  ctx.lineCap='round';
  function chunk(){if(my!==job)return;const end=Math.min(plan.length,i+5000);
    for(;i<end;i++){const p=plan[i];let x,y,gx,gy,m,tries=0;
      do{x=Math.floor(R()*W);y=Math.floor(R()*H);[gx,gy]=grad(x,y);m=Math.hypot(gx,gy);tries++;}while(p.d&&tries<6&&R()>Math.min(1,m/(60*p.d))+0.08);
      const o=(y*W+x)*4;let r=bd[o],gg=bd[o+1],b=bd[o+2];const l=(r+gg+b)/3,sat=1.1,br=rr(0.93,1.07);
      r=(l+(r-l)*sat)*br+rr(-9,9);gg=(l+(gg-l)*sat)*br+rr(-9,9);b=(l+(b-l)*sat)*br+rr(-9,9);
      let a=m>8?Math.atan2(gy,gx)+Math.PI/2:Math.sin(x*0.013+y*0.007)*0.5+rr(-0.25,0.25);
      const len=rr(p.l[0],p.l[1])*(m>30&&p.d?0.6:1),w=rr(p.w[0],p.w[1]);
      const cx=x*K,cy=y*K,dx=Math.cos(a)*len/2,dy=Math.sin(a)*len/2,nx=-Math.sin(a)*w*0.28,ny=Math.cos(a)*w*0.28;
      ctx.strokeStyle=`rgb(${r|0},${gg|0},${b|0})`;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(cx-dx,cy-dy);ctx.lineTo(cx+dx,cy+dy);ctx.stroke();
      // relief de la pâte : arête claire d'un côté, sombre de l'autre
      const s=ny<0?1:-1;
      ctx.strokeStyle=`rgba(${Math.min(255,r+45)|0},${Math.min(255,gg+45)|0},${Math.min(255,b+40)|0},.45)`;ctx.lineWidth=w*0.22;ctx.beginPath();ctx.moveTo(cx-dx+nx*s,cy-dy+ny*s);ctx.lineTo(cx+dx+nx*s,cy+dy+ny*s);ctx.stroke();
      ctx.strokeStyle=`rgba(${r*0.6|0},${gg*0.6|0},${b*0.7|0},.3)`;ctx.lineWidth=w*0.18;ctx.beginPath();ctx.moveTo(cx-dx-nx*s,cy-dy-ny*s);ctx.lineTo(cx+dx-nx*s,cy+dy-ny*s);ctx.stroke();}
    st.textContent='Peinture… '+Math.round(i/plan.length*100)+' %';
    if(i<plan.length)requestAnimationFrame(chunk);else{finish();st.textContent='';btn.disabled=false;}}
  requestAnimationFrame(chunk);}
function finish(){// grain de toile + léger vignettage
  const n=document.createElement('canvas');n.width=n.height=256;const g=n.getContext('2d'),id=g.createImageData(256,256);
  for(let k=0;k<id.data.length;k+=4){const x=(k/4)%256,y=Math.floor(k/4/256),v=128+((x%3===0)?14:0)+((y%3===0)?14:0)+(Math.random()-0.5)*40;id.data[k]=id.data[k+1]=id.data[k+2]=v;id.data[k+3]=255;}
  g.putImageData(id,0,0);ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.18;ctx.fillStyle=ctx.createPattern(n,'repeat');ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();
  const vg=ctx.createRadialGradient(cv.width/2,cv.height/2,cv.height*0.35,cv.width/2,cv.height/2,cv.height*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(30,20,10,.25)');ctx.fillStyle=vg;ctx.fillRect(0,0,cv.width,cv.height);
  document.body.dataset.done='1';}

let seed=Number(new URLSearchParams(location.search).get('seed'))||Math.floor(Math.random()*1e6);
document.getElementById('again').onclick=()=>{seed=Math.floor(Math.random()*1e6);document.body.dataset.done='';paint(seed);};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='petit-village-'+seed+'.png';a.href=cv.toDataURL('image/png');a.click();};
paint(seed);
</script>
